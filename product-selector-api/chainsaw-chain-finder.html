<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chainsaw Chain Finder</title>
  <style>
    :root {
      color-scheme: light;
      --card-tint-percent: 20%;
    }
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: Arial, sans-serif;
      background: #f7f7f8;
      color: #111;
    }
    .page {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      color: var(--accent-color, rgb(20, 111, 248));
    }
    .mode-switch {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 14px 0;
      padding: 4px;
      border-radius: 8px;
      background: #eef2f7;
    }
    .mode-button {
      background: transparent;
      color: #344054;
      border-color: transparent;
      font-weight: 700;
    }
    .mode-button.active {
      color: #fff;
      background: var(--accent-color, rgb(20, 111, 248));
      border-color: var(--accent-color, rgb(20, 111, 248));
    }
    .search-panel.hidden { display: none; }
    .form-note { margin: -2px 0 10px; color: #667085; font-size: 12px; line-height: 1.4; }
    .row { margin-bottom: 10px; }
    select, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #bbb;
      font-size: 14px;
      background: #fff;
    }
    button {
      cursor: pointer;
      background: var(--accent-color, rgb(20, 111, 248));
      color: #fff;
      border-color: var(--accent-color, rgb(20, 111, 248));
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    .results {
      margin-top: 14px;
      display: grid;
      gap: 8px;
    }
    .card {
      border: 1px solid var(--accent-color, rgb(20, 111, 248));
      border-radius: 8px;
      padding: 10px;
      background: color-mix(
        in srgb,
        var(--accent-color, rgb(20, 111, 248)) var(--card-tint-percent),
        #ffffff calc(100% - var(--card-tint-percent))
      );
      color: #0f2850;
    }
    .card-link {
      display: block;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.12s ease, transform 0.12s ease;
    }
    .card-link:hover,
    .card-link:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(20, 111, 248, 0.22);
    }
    .card-columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 14px;
    }
    .card-col {
      display: grid;
      gap: 8px;
    }
    .card-row strong {
      display: block;
      font-size: 12px;
      line-height: 1.2;
      opacity: 0.9;
    }
    .card-row span {
      display: block;
      margin-top: 2px;
      font-size: 14px;
      line-height: 1.2;
    }
    .no-match-message { margin: 0 0 12px; line-height: 1.4; }
    .spec-title { margin: 0 0 8px; font-size: 13px; }
    .spec-list { display: grid; gap: 8px; }
    .spec-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px 14px;
      padding-top: 8px;
      border-top: 1px solid color-mix(in srgb, var(--accent-color, rgb(20, 111, 248)) 35%, transparent);
    }
    .error { color: #b00020; }
    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1 id="formTitle">KMC Chainsaw Chain Finder</h1>

    <div id="widget">
      <div class="mode-switch" role="tablist" aria-label="Search method">
        <button id="modeFitment" class="mode-button active" type="button" role="tab" aria-selected="true">Search by Chainsaw</button>
        <button id="modeSpecs" class="mode-button" type="button" role="tab" aria-selected="false">Search by Specifications</button>
      </div>
      <div id="fitmentSearch" class="search-panel">
        <div class="row"><select id="brand"><option value="">Select Brand</option></select></div>
        <div class="row"><select id="model" disabled><option value="">Select Model</option></select></div>
        <div class="row"><select id="barLength" disabled><option value="">Select Bar Length</option></select></div>
        <div class="row"><button id="findBtn" disabled>Find Chains</button></div>
      </div>
      <div id="specSearch" class="search-panel hidden">
        <p class="form-note">Use this option when you already know the chain specifications.</p>
        <div class="row"><select id="specPitch"><option value="">Select Pitch</option></select></div>
        <div class="row"><select id="specGauge" disabled><option value="">Select Gauge</option></select></div>
        <div class="row"><select id="specLinks" disabled><option value="">Select Drive Links</option></select></div>
        <div class="row"><select id="specCutter" disabled><option value="">Any Cutter Style</option></select></div>
        <div class="row"><button id="findSpecBtn" disabled>Find Chains</button></div>
      </div>
      <div id="results" class="results"></div>
    </div>
  </div>

  <script>
    (function () {
      const API = "https://chain-api.rtf-cloud.com";

      const brandSel = document.getElementById("brand");
      const modelSel = document.getElementById("model");
      const barSel = document.getElementById("barLength");
      const findBtn = document.getElementById("findBtn");
      const modeFitment = document.getElementById("modeFitment");
      const modeSpecs = document.getElementById("modeSpecs");
      const fitmentSearch = document.getElementById("fitmentSearch");
      const specSearch = document.getElementById("specSearch");
      const specPitch = document.getElementById("specPitch");
      const specGauge = document.getElementById("specGauge");
      const specLinks = document.getElementById("specLinks");
      const specCutter = document.getElementById("specCutter");
      const findSpecBtn = document.getElementById("findSpecBtn");
      const results = document.getElementById("results");
      const formTitle = document.getElementById("formTitle");
      const defaults = {
        form_title: "KMC Chainsaw Chain Finder",
        accent_color: "rgb(20, 111, 248)",
        button_label: "Find Chains",
        card_tint_percent: "20",
        no_result_message: "we don't offer this chainsaw chain at the moment, please check again in the future",
      };
      let config = { ...defaults };

      function setOptions(select, values, placeholder) {
        select.innerHTML = `<option value="">${placeholder}</option>` +
          values.map((v) => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
        select.disabled = values.length === 0;
      }

      function resetFrom(level) {
        if (level <= 2) setOptions(modelSel, [], "Select Model");
        if (level <= 3) setOptions(barSel, [], "Select Bar Length");
        findBtn.disabled = true;
        results.innerHTML = "";
      }

      async function getJson(url) {
        const res = await fetch(url);
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || "Request failed");
        return body;
      }

      function applyConfig() {
        formTitle.textContent = config.form_title || defaults.form_title;
        findBtn.textContent = config.button_label || defaults.button_label;
        findSpecBtn.textContent = config.button_label || defaults.button_label;
        document.documentElement.style.setProperty("--accent-color", config.accent_color || defaults.accent_color);
        document.documentElement.style.setProperty("--card-tint-percent", normalizeTintPercent(config.card_tint_percent));
      }

      async function loadConfig() {
        try {
          const data = await getJson(`${API}/catalog/config`);
          config = { ...defaults, ...data };
        } catch (_err) {
          config = { ...defaults };
        }
        applyConfig();
      }

      async function loadBrands() {
        const data = await getJson(`${API}/catalog/brands`);
        setOptions(brandSel, data.brands || [], "Select Brand");
      }

      function setSearchMode(mode) {
        const specsActive = mode === "specifications";
        modeFitment.classList.toggle("active", !specsActive);
        modeSpecs.classList.toggle("active", specsActive);
        modeFitment.setAttribute("aria-selected", String(!specsActive));
        modeSpecs.setAttribute("aria-selected", String(specsActive));
        fitmentSearch.classList.toggle("hidden", specsActive);
        specSearch.classList.toggle("hidden", !specsActive);
        results.innerHTML = "";
        if (specsActive && specPitch.options.length <= 1) loadSpecOptions().catch(showSearchError);
      }

      function showSearchError(err) {
        results.innerHTML = `<div class="error">${escapeHtml(err && err.message || "Request failed")}</div>`;
      }

      async function loadSpecOptions(level = 1) {
        const url = new URL(`${API}/catalog/spec-options`);
        if (level > 1 && specPitch.value) url.searchParams.set("pitch", specPitch.value);
        if (level > 2 && specGauge.value) url.searchParams.set("gauge", specGauge.value);
        if (level > 3 && specLinks.value) url.searchParams.set("links", specLinks.value);
        const data = await getJson(url.toString());
        if (level === 1) {
          setOptions(specPitch, data.pitches || [], "Select Pitch");
          setOptions(specGauge, [], "Select Gauge");
          setOptions(specLinks, [], "Select Drive Links");
          setOptions(specCutter, [], "Any Cutter Style");
        } else if (level === 2) {
          setOptions(specGauge, data.gauges || [], "Select Gauge");
          setOptions(specLinks, [], "Select Drive Links");
          setOptions(specCutter, [], "Any Cutter Style");
        } else if (level === 3) {
          setOptions(specLinks, data.links || [], "Select Drive Links");
          setOptions(specCutter, [], "Any Cutter Style");
        } else {
          setOptions(specCutter, data.chisel_styles || [], "Any Cutter Style");
          specCutter.disabled = !(data.chisel_styles || []).length;
        }
        findSpecBtn.disabled = !(specPitch.value && specGauge.value && specLinks.value);
      }

      modeFitment.addEventListener("click", () => setSearchMode("fitment"));
      modeSpecs.addEventListener("click", () => setSearchMode("specifications"));

      specPitch.addEventListener("change", async function () {
        results.innerHTML = "";
        setOptions(specGauge, [], "Select Gauge");
        setOptions(specLinks, [], "Select Drive Links");
        setOptions(specCutter, [], "Any Cutter Style");
        findSpecBtn.disabled = true;
        if (!specPitch.value) return;
        try { await loadSpecOptions(2); } catch (err) { showSearchError(err); }
      });

      specGauge.addEventListener("change", async function () {
        results.innerHTML = "";
        setOptions(specLinks, [], "Select Drive Links");
        setOptions(specCutter, [], "Any Cutter Style");
        findSpecBtn.disabled = true;
        if (!specPitch.value || !specGauge.value) return;
        try { await loadSpecOptions(3); } catch (err) { showSearchError(err); }
      });

      specLinks.addEventListener("change", async function () {
        results.innerHTML = "";
        setOptions(specCutter, [], "Any Cutter Style");
        findSpecBtn.disabled = !(specPitch.value && specGauge.value && specLinks.value);
        if (findSpecBtn.disabled) return;
        try { await loadSpecOptions(4); } catch (err) { showSearchError(err); }
      });

      brandSel.addEventListener("change", async function () {
        resetFrom(2);
        if (!brandSel.value) return;

        try {
          const url = new URL(`${API}/catalog/models`);
          url.searchParams.set("brand", brandSel.value);
          const data = await getJson(url.toString());
          setOptions(modelSel, data.models || [], "Select Model");
        } catch (err) {
          results.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
        }
      });

      modelSel.addEventListener("change", async function () {
        resetFrom(3);
        if (!brandSel.value || !modelSel.value) return;

        try {
          const url = new URL(`${API}/catalog/bar-lengths`);
          url.searchParams.set("brand", brandSel.value);
          url.searchParams.set("model", modelSel.value);
          const data = await getJson(url.toString());
          setOptions(barSel, data.bar_lengths || [], "Select Bar Length");
        } catch (err) {
          results.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
        }
      });

      barSel.addEventListener("change", function () {
        findBtn.disabled = !(brandSel.value && modelSel.value && barSel.value);
      });

      findBtn.addEventListener("click", async function () {
        results.innerHTML = "";

        try {
          const url = new URL(`${API}/catalog/results`);
          url.searchParams.set("brand", brandSel.value);
          url.searchParams.set("model", modelSel.value);
          url.searchParams.set("barLength", barSel.value);

          const data = await getJson(url.toString());
          renderSearchResults(data);
        } catch (err) {
          showSearchError(err);
        }
      });

      findSpecBtn.addEventListener("click", async function () {
        results.innerHTML = "";
        try {
          const url = new URL(`${API}/catalog/spec-results`);
          url.searchParams.set("pitch", specPitch.value);
          url.searchParams.set("gauge", specGauge.value);
          url.searchParams.set("links", specLinks.value);
          if (specCutter.value) url.searchParams.set("chiselStyle", specCutter.value);
          renderSearchResults(await getJson(url.toString()));
        } catch (err) {
          showSearchError(err);
        }
      });

      function renderSearchResults(data) {
        const chains = Array.isArray(data && data.chains) ? data.chains : [];
        if (!chains.length) {
          results.innerHTML = renderNoMatchCard(data && data.match_keys || []);
          return;
        }
        results.innerHTML = chains.map((chain) => renderChainCard(chain)).join("");
      }

      function renderChainCard(chain) {
        const content = `<div class="card-columns">
          <div class="card-col">
            <div class="card-row"><strong>Pitch</strong><span>${escapeHtml(chain.pitch || "N/A")}</span></div>
            <div class="card-row"><strong>Gauge</strong><span>${escapeHtml(chain.gauge || "N/A")}</span></div>
            <div class="card-row"><strong>Drive Links</strong><span>${escapeHtml(chain.links || "N/A")}</span></div>
            <div class="card-row"><strong>Chisel Style</strong><span>${escapeHtml(chain.chisel_style || "N/A")}</span></div>
          </div>
          <div class="card-col">
            <div class="card-row"><strong>ANSI Low Kickback</strong><span>${escapeHtml(chain.ansi_low_kickback || "N/A")}</span></div>
            <div class="card-row"><strong>Profile Class</strong><span>${escapeHtml(chain.profile_class || "N/A")}</span></div>
            <div class="card-row"><strong>Kerf Type</strong><span>${escapeHtml(chain.kerf_type || "N/A")}</span></div>
            <div class="card-row"><strong>Sequence Type</strong><span>${escapeHtml(chain.sequence_type || "N/A")}</span></div>
          </div>
        </div>`;
        return chain.url
          ? `<a class="card card-link" href="${escapeHtml(chain.url)}" target="_blank" rel="noopener">${content}</a>`
          : `<div class="card">${content}</div>`;
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function renderNoMatchCard(matchKeys) {
        const unique = [];
        const seen = new Set();
        for (const key of Array.isArray(matchKeys) ? matchKeys : []) {
          const pitch = String(key && key.pitch || "").trim();
          const gauge = String(key && key.gauge || "").trim();
          const links = String(key && key.driveLinks || "").trim();
          const signature = `${pitch}|${gauge}|${links}`;
          if ((!pitch && !gauge && !links) || seen.has(signature)) continue;
          seen.add(signature);
          unique.push({ pitch, gauge, links });
        }

        const specification = unique.length
          ? `<div class="spec-title"><strong>Required chain specification</strong></div>
             <div class="spec-list">
               ${unique.map((key) => `
                 <div class="spec-grid">
                   <div class="card-row"><strong>Pitch</strong><span>${escapeHtml(key.pitch || "N/A")}</span></div>
                   <div class="card-row"><strong>Gauge</strong><span>${escapeHtml(key.gauge || "N/A")}</span></div>
                   <div class="card-row"><strong>Link Count</strong><span>${escapeHtml(key.links || "N/A")}</span></div>
                 </div>`).join("")}
             </div>`
          : "";

        return `<div class="card">
          <p class="no-match-message">${escapeHtml(config.no_result_message || defaults.no_result_message)}</p>
          ${specification}
        </div>`;
      }

      function normalizeTintPercent(value) {
        const numeric = Number(String(value == null ? "" : value).replace("%", "").trim());
        if (!Number.isFinite(numeric)) return `${defaults.card_tint_percent}%`;
        const clamped = Math.min(100, Math.max(0, numeric));
        return `${clamped}%`;
      }

      loadConfig()
        .then(loadBrands)
        .catch(function (err) {
          results.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
        });
    })();
  </script>
</body>
</html>
